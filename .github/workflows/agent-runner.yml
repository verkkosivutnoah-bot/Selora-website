name: Agent Runner

# Started only by dispatch-agent-job, never on a schedule of its own. The
# schedule lives in Supabase (agent_jobs.run_at_time) so the dashboard can edit
# it without a commit; this workflow is the muscle, not the clock.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'agent_runs row to execute'
        required: true
        type: string

# One run at a time. Two agents editing the same tree would produce branches
# that each miss the other's work.
concurrency:
  group: agent-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Claude gets an hour inside run.mjs; leave it room to report a timeout.
    timeout-minutes: 75

    permissions:
      contents: write        # push the branch the agent produces

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name  "Selora Agent"
          git config user.email "verkkosivut.noah@gmail.com"

      - name: Execute run
        env:
          AGENT_RUN_ID:              ${{ inputs.run_id }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node agent/run.mjs
